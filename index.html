<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka</title>

    <!-- Sekme İkonu -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sol Menü (Sidebar) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand">🤖 Yapay Zeka</div>
        </div>

        <button class="nav-item new-chat" onclick="startNewChat()">
            <span>✏️ Yeni sohbet</span>
        </button>

        <div class="history-title">Sohbet Geçmişi</div>
        <div class="sidebar-history" id="chatHistory"></div>
    </div>

    <!-- Ana Sohbet Alanı -->
    <div class="main-content">
        <div class="top-bar">
            <div class="model-selector">
                <span>Yapay Zeka Asistanı</span>
            </div>
        </div>

        <div class="chat-container" id="chatMessages"></div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Yapay Zeka'ya bir şeyler sor..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">⬆</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
