<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sol Menü (Sidebar) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand"><i class="fa-solid fa-robot"></i> Yapay Zeka</div>
        </div>

        <button class="nav-item new-chat" onclick="startNewChat()">
            <i class="fa-regular fa-pen-to-square"></i>
            <span>Yeni sohbet</span>
        </button>

        <div class="history-title">Sohbet Geçmişi</div>
        <div class="sidebar-history" id="chatHistory">
            <!-- Sohbet geçmişi buraya listelenecek -->
        </div>
    </div>

    <!-- Ana Sohbet Alanı -->
    <div class="main-content">
        <!-- Üst Bar -->
        <div class="top-bar">
            <div class="model-selector">
                <span>Yapay Zeka Asistanı</span>
            </div>
        </div>

        <!-- Mesaj Akışı -->
        <div class="chat-container" id="chatMessages">
            <!-- Mesajlar dinamik eklenecek -->
        </div>

        <!-- Alt Giriş Kutusu -->
        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Yapay Zeka'ya bir şeyler sor..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
