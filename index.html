<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cam AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">Cam AI</div>
    <button class="btn primary" id="newChat">+ Yeni sohbet</button>
    <input class="search" id="search" type="search" placeholder="Sohbetlerde ara…" aria-label="Sohbetlerde ara">
    <ul class="list" id="list"></ul>
    <button class="btn ghost" id="settingsBtn">Google ayarları</button>
  </aside>
  <main class="main">
    <header class="top">
      <button class="btn ghost menu" id="menu" aria-label="Menü">☰</button>
      <h1 id="title">Yeni sohbet</h1>
      <button class="btn danger" id="delCur">Sohbeti sil</button>
    </header>
    <section class="msgs" id="msgs" aria-live="polite"></section>
    <form class="composer" id="form">
      <input id="input" autocomplete="off" placeholder="Bir konu yaz, Google'da arayıp özetleyeyim…">
      <button class="btn primary" type="submit">Gönder</button>
    </form>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h2>Google arama ayarları</h2>
    <p>Google Programmable Search API anahtarın ve arama motoru kimliğin (cx) gerekli.</p>
    <label>API anahtarı<input id="key" autocomplete="off"></label>
    <label>Arama motoru kimliği (cx)<input id="cx" autocomplete="off"></label>
    <div class="row"><button class="btn ghost" value="cancel">Kapat</button>
    <button class="btn primary" id="save" value="ok">Kaydet</button></div>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
